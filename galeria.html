<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - GALERÍA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-image: url('nube.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
        }

        /* Cabecera superior */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
        }

        header img {
            width: 230px;
            height: auto;
        }

        #user-badge {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: bold;
            color: #ff1493;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* Contenedor Central de Grupos */
        #gallery-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #gallery-container h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #1a1a1a;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .group-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff69b4, #00bfff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
            transition: all 0.3s ease;
        }

        .group-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.4);
        }

        /* Contenedor Inferior de Botones (Carrito y Salir) */
        footer {
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 15px;
        }

        .footer-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        #btn-carrito {
            background: linear-gradient(135deg, #00bfff, #1e90ff);
            color: white;
        }

        #btn-salir {
            background: linear-gradient(135deg, #ff4500, #dc143c);
            color: white;
        }

        .footer-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Cabecera con Logo y Código de Usuario -->
    <header>
        <img src="marisal--2026.png" alt="LOGO MARISAL">
        <div id="user-badge">CÓDIGO: <span id="display-codigo">---</span></div>
    </header>

    <!-- Botones Centrales de Selección -->
    <div id="gallery-container">
        <h2>SELECCIONA UNA CATEGORÍA</h2>
        <button class="group-btn" onclick="alert('Abriendo sección: CABEZA')">CABEZA</button>
        <button class="group-btn" onclick="alert('Abriendo sección: CUERPO')">CUERPO</button>
        <button class="group-btn" onclick="alert('Abriendo sección: ACCESORIOS')">ACCESORIOS</button>
    </div>

    <!-- Botones Inferiores -->
    <footer>
        <button class="footer-btn" id="btn-carrito" onclick="alert('Ir a CARRITO')">CARRITO</button>
        <button class="footer-btn" id="btn-salir" onclick="window.location.href='index.html'">SALIR</button>
    </footer>

    <script>
            // Recuperar el código ingresado en el login o asignarlo si viene vacío
            let codigoCliente = localStorage.getItem("codigo_cliente");
            if (!codigoCliente) {
                codigoCliente = "RP73"; // O el código por defecto que corresponda
            }
            document.getElementById("etiqueta_codigo").innerText = "CÓDIGO: " + codigoCliente;
    </script>
</body>
</html>
