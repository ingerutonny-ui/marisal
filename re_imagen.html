<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1d2671, #c33764);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn-eliminar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-eliminar:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>REGISTRAR PRODUCTO</h2>
    
    <form id="productoForm">
        <div class="form-group">
            <label>CÓDIGO DE PRODUCTO (AUTOMÁTICO):</label>
            <input type="text" id="codigo_pro" readonly style="background-color: #e9ecef;">
        </div>

        <div class="form-group">
            <label>SELECCIONAR IMAGEN:</label>
            <select id="imagen_pro" onchange="actualizarCodigoAutomatico()">
                <!-- 10 Cabezas -->
                <option value="galeria/cabeza_1.jpg">CABEZA 1</option>
                <option value="galeria/cabeza_2.jpg">CABEZA 2</option>
                <option value="galeria/cabeza_3.jpg">CABEZA 3</option>
                <option value="galeria/cabeza_4.jpg">CABEZA 4</option>
                <option value="galeria/cabeza_5.jpg">CABEZA 5</option>
                <option value="galeria/cabeza_6.jpg">CABEZA 6</option>
                <option value="galeria/cabeza_7.jpg">CABEZA 7</option>
                <option value="galeria/cabeza_8.jpg">CABEZA 8</option>
                <option value="galeria/cabeza_9.jpg">CABEZA 9</option>
                <option value="galeria/cabeza_10.jpg">CABEZA 10</option>
                
                <!-- 10 Cuerpos -->
                <option value="galeria/cuerpo_1.jpg">CUERPO 1</option>
                <option value="galeria/cuerpo_2.jpg">CUERPO 2</option>
                <option value="galeria/cuerpo_3.jpg">CUERPO 3</option>
                <option value="galeria/cuerpo_4.jpg">CUERPO 4</option>
                <option value="galeria/cuerpo_5.jpg">CUERPO 5</option>
                <option value="galeria/cuerpo_6.jpg">CUERPO 6</option>
                <option value="galeria/cuerpo_7.jpg">CUERPO 7</option>
                <option value="galeria/cuerpo_8.jpg">CUERPO 8</option>
                <option value="galeria/cuerpo_9.jpg">CUERPO 9</option>
                <option value="galeria/cuerpo_10.jpg">CUERPO 10</option>

                <!-- 10 Accesorios -->
                <option value="galeria/accesorios_1.jpg">ACCESORIOS 1</option>
                <option value="galeria/accesorios_2.jpg">ACCESORIOS 2</option>
                <option value="galeria/accesorios_3.jpg">ACCESORIOS 3</option>
                <option value="galeria/accesorios_4.jpg">ACCESORIOS 4</option>
                <option value="galeria/accesorios_5.jpg">ACCESORIOS 5</option>
                <option value="galeria/accesorios_6.jpg">ACCESORIOS 6</option>
                <option value="galeria/accesorios_7.jpg">ACCESORIOS 7</option>
                <option value="galeria/accesorios_8.jpg">ACCESORIOS 8</option>
                <option value="galeria/accesorios_9.jpg">ACCESORIOS 9</option>
                <option value="galeria/accesorios_10.jpg">ACCESORIOS 10</option>
            </select>
        </div>

        <div class="form-group">
            <label>NOMBRE DEL PRODUCTO:</label>
            <input type="text" id="nombre_pro" required oninput="actualizarCodigoAutomatico()">
        </div>

        <div class="form-group">
            <label>PRECIO:</label>
            <input type="number" step="0.01" id="precio_pro" required>
        </div>

        <div class="form-group">
            <label>COLOR:</label>
            <input type="text" id="color_pro" required>
        </div>

        <div class="form-group">
            <label>CANTIDAD:</label>
            <input type="number" id="cantidad_pro" required>
        </div>

        <button type="submit">GUARDAR PRODUCTO</button>
        <div id="mensaje"></div>
    </form>

    <h3>LISTADO DE PRODUCTOS</h3>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Color</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaProductos">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = "https://marisal.onrender.com/api";

    function obtenerPrefijo(imagen) {
        if (imagen.includes("cabeza")) return "CA";
        if (imagen.includes("cuerpo")) return "CU";
        if (imagen.includes("accesorios")) return "AC";
        return "PRO";
    }

    function actualizarCodigoAutomatico() {
        const imagen = document.getElementById("imagen_pro").value;
        const nombre = document.getElementById("nombre_pro").value.trim();
        const prefijo = obtenerPrefijo(imagen);
        
        if (nombre.length > 0) {
            const palabra = nombre.split(" ")[0].toUpperCase();
            const randomNum = Math.floor(Math.random() * 90) + 10;
            document.getElementById("codigo_pro").value = `${prefijo}-${palabra}-${randomNum}`;
        } else {
            document.getElementById("codigo_pro").value = "";
        }
    }

    async function cargarProductos() {
        try {
            const response = await fetch(`${API_URL}/listar_productos`);
            const productos = await response.json();
            const tbody = document.getElementById("tablaProductos");
            tbody.innerHTML = "";

            productos.forEach(prod => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${prod.codigo_pro}</td>
                    <td>${prod.nombre_pro}</td>
                    <td>$${prod.precio_pro.toFixed(2)}</td>
                    <td>${prod.color_pro}</td>
                    <td>${prod.cantidad_pro}</td>
                    <td><button class="btn-eliminar" onclick="eliminarProducto('${prod.codigo_pro}')">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Error al cargar productos:", error);
        }
    }

    document.getElementById("productoForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const data = {
            codigo_pro: document.getElementById("codigo_pro").value,
            imagen_pro: document.getElementById("imagen_pro").value,
            nombre_pro: document.getElementById("nombre_pro").value,
            precio_pro: parseFloat(document.getElementById("precio_pro").value),
            color_pro: document.getElementById("color_pro").value,
            cantidad_pro: parseInt(document.getElementById("cantidad_pro").value)
        };

        const msgDiv = document.getElementById("mensaje");

        try {
            const response = await fetch(`${API_URL}/registrar_producto`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                msgDiv.style.color = "green";
                msgDiv.innerText = "PRODUCTO REGISTRADO EXITOSAMENTE";
                document.getElementById("productoForm").reset();
                document.getElementById("codigo_pro").value = "";
                cargarProductos();
            } else {
                msgDiv.style.color = "red";
                msgDiv.innerText = result.detail || "Error al registrar";
            }
        } catch (error) {
            msgDiv.style.color = "red";
            msgDiv.innerText = "Error de conexión con el servidor.";
        }
    });

    async function eliminarProducto(codigo) {
        if (!confirm(`¿Estás seguro de eliminar el producto ${codigo}?`)) return;

        try {
            const response = await fetch(`${API_URL}/eliminar_producto/${codigo}`, {
                method: "DELETE"
            });

            if (response.ok) {
                cargarProductos();
            } else {
                alert("No se pudo eliminar el producto.");
            }
        } catch (error) {
            console.error("Error al eliminar:", error);
        }
    }

    cargarProductos();
</script>

</body>
</html>
