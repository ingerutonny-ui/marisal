<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - DUEÑA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-image: url('nube.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transform-origin: center;
        }

        /* Escala proporcional para PC */
        @media (min-width: 768px) {
            .admin-card {
                transform: scale(1.35);
            }
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }

        .logo-container img {
            width: 240px;
            height: auto;
        }

        /* Contenedor para colocar los botones lado a lado */
        .buttons-container {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-menu {
            flex: 1;
            aspect-ratio: 1; /* Hace que los botones sean cuadrados perfectos */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            border-radius: 18px; /* Puntas redondeadas estéticas */
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-productos {
            background: linear-gradient(135deg, #ff69b4, #c33764);
            color: white;
        }

        .btn-productos:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.4);
        }

        .btn-clientes {
            background: linear-gradient(135deg, #00bfff, #1d2671);
            color: white;
        }

        .btn-clientes:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 191, 255, 0.4);
        }

        .back-link {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
        }

        .back-link a {
            color: #ff69b4;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="logo-container">
            <img src="marisal--2026.png" alt="LOGO MARISAL">
        </div>

        <div class="buttons-container">
            <a href="re_imagen.html" class="btn-menu btn-productos">PRODUCTOS</a>
            <a href="lista.html" class="btn-menu btn-clientes">CLIENTES</a>
        </div>

        <div class="back-link">
            <a href="index.html">VOLVER AL INICIO</a>
        </div>
    </div>

</body>
</html>
