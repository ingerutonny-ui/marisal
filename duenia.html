<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - PANEL DE LA DUEÑA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-color: #0f172a; /* Fondo azul oscuro elegante */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .admin-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transform-origin: center;
        }

        /* Escala proporcional para PC */
        @media (min-width: 768px) {
            .admin-card {
                transform: scale(1.3);
            }
        }

        .logo-container img {
            width: 160px;
            height: auto;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            color: #f8fafc;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn-menu {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-productos {
            background: linear-gradient(135deg, #ff69b4, #c33764);
            color: white;
        }

        .btn-productos:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
        }

        .btn-clientes {
            background: linear-gradient(135deg, #00bfff, #1d2671);
            color: white;
        }

        .btn-clientes:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 191, 255, 0.4);
        }

        .back-link {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .back-link a {
            color: #00bfff;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="logo-container">
            <img src="marisal--2026.png" alt="LOGO MARISAL">
        </div>

        <h2>PANEL DE CONTROL</h2>

        <a href="re_imagen.html" class="btn-menu btn-productos">GESTIONAR PRODUCTOS</a>
        
        <a href="lista.html" class="btn-menu btn-clientes">VER LISTA DE CLIENTES</a>

        <div class="back-link">
            <a href="index.html">VOLVER AL INICIO</a>
        </div>
    </div>

</body>
</html>
