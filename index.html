<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - ACCESO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-image: url('nube.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* PANTALLA DE CARGA CON FONDO BLANCO ELEGANTE Y LOGOTIPO GRANDE */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-logo {
            width: 380px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.12));
        }

        .progress-bar-container {
            width: 340px;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #00bfff);
            transition: width 0.1s linear;
        }

        .loading-text {
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            letter-spacing: 1px;
        }

        /* CONTENEDOR PRINCIPAL / FORMULARIO BLANCO ELEGANTE */
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform-origin: center;
        }

        /* ESCALA PROPORCIONAL SOLO PARA COMPUTADORAS */
        @media (min-width: 1080px) {
            .login-card {
                transform: scale(1.35);
            }
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: -5px;
        }

        .logo-container img {
            width: 180px;
            height: auto;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: -2px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 11px;
            font-weight: bold;
            color: #475569;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
            background: #ffffff;
        }

        .captcha-box {
            display: flex;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 14px;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ff69b4;
            font-size: 16px;
            width: 100%;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: rotate(180deg);
            color: #1e293b;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff69b4, #00bfff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.4);
        }

        .back-link {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: -2px;
        }

        .back-link a {
            color: #ff69b4;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA CON FONDO BLANCO Y LOGOTIPO GRANDE -->
    <div id="loading-screen">
        <img src="marisal--2026.png" alt="Logo" class="loading-logo">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="loading-text" id="loadingText">CARGANDO... 0%</div>
    </div>

    <div class="login-card">
        <div class="logo-container">
            <img src="marisal--2026.png" alt="LOGO MARISAL">
        </div>

        <h2>ACCESO CLIENTES</h2>

        <div class="input-group">
            <label for="codigo_cliente">TU CÓDIGO DE CLIENTE:</label>
            <input type="text" id="codigo_cliente" placeholder="EJ: RP73" autocomplete="off">
        </div>

        <div class="input-group">
            <label>VERIFICACIÓN CAPTCHA:</label>
            <div class="captcha-box">
                <span id="captchaText">N Q I V</span>
                <button type="button" class="refresh-btn" onclick="generarCaptcha()">🔄</button>
            </div>
            <input type="text" id="inputCaptcha" placeholder="INGRESA EL CAPTCHA" autocomplete="off">
        </div>

        <button type="button" class="submit-btn" onclick="verificarAcceso()">INGRESAR A GALERÍA</button>

        <div class="back-link">
            ¿NO TIENES CÓDIGO? <a href="registro.html">REGÍSTRATE AQUÍ</a>
        </div>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById("progressBar");
        const loadingText = document.getElementById("loadingText");
        const loadingScreen = document.getElementById("loading-screen");

        const interval = setInterval(() => {
            progress += 2;
            if (progress <= 100) {
                progressBar.style.width = progress + "%";
                loadingText.innerText = "CARGANDO... " + progress + "%";
            } else {
                clearInterval(interval);
                loadingScreen.style.opacity = "0";
                setTimeout(() => {
                    loadingScreen.style.display = "none";
                }, 500);
            }
        }, 20);

        let textoCaptchaActual = "";

        function generarCaptcha() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let captcha = "";
            for (let i = 0; i < 4; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            textoCaptchaActual = captcha;
            document.getElementById("captchaText").innerText = captcha.split("").join(" ");
        }

        window.onload = function() {
            generarCaptcha();
        };

        async function verificarAcceso() {
            const codigo = document.getElementById("codigo_cliente").value.trim().toUpperCase();
            const captchaIngresado = document.getElementById("inputCaptcha").value.trim().toUpperCase();

            if (!codigo) {
                alert("POR FAVOR, INGRESA TU CÓDIGO DE CLIENTE.");
                return;
            }

            if (captchaIngresado !== textoCaptchaActual) {
                alert("EL CAPTCHA ES INCORRECTO. INTÉNTALO NUEVAMENTE.");
                generarCaptcha();
                document.getElementById("inputCaptcha").value = "";
                return;
            }

            try {
                const response = await fetch(`https://marisal.onrender.com/api/verificar_cliente/${codigo}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "EL CÓDIGO NO EXISTE EN EL SISTEMA.");
                }

                const data = await response.json();
                
                localStorage.setItem("cliente_actual", JSON.stringify(data));
                window.location.href = "galeria.html";

            } catch (error) {
                alert(error.message);
                generarCaptcha();
                document.getElementById("inputCaptcha").value = "";
            }
        }
    </script>
</body>
</html>
