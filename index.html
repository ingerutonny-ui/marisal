<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Clientes - Marisal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-logo-img {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
        }

        .progress-container {
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            padding: 3px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .progress-bar {
            width: 0%;
            height: 12px;
            background: linear-gradient(to right, #ec407a, #00bcd4);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .progress-text {
            color: #ffffff;
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: none;
        }

        h2 {
            color: #1a1a1a;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00bcd4;
        }

        #codigo_cli {
            text-transform: uppercase;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            background: #e8eaf6;
            border-radius: 8px;
            padding: 10px;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .captcha-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #d81b60;
            user-select: none;
        }

        .refresh-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: #555;
        }

        .btn-ingresar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #ec407a, #00bcd4);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 188, 212,.4);
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-ingresar:hover {
            opacity: 0.9;
        }

        .register-link {
            main-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .register-link a {
            color: #00bcd4;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <img src="marisal--2026.png" alt="Marisal Logo" class="loader-logo-img">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0%</div>
    </div>

    <div class="login-card" id="login-card">
        <h2>ACCESO CLIENTES</h2>
        
        <div class="form-group">
            <label>TU CÓDIGO DE CLIENTE:</label>
            <input type="text" id="codigo_cli" placeholder="EJ. RP73" autocomplete="off">
        </div>

        <div class="form-group">
            <label>VERIFICACIÓN CAPTCHA:</label>
            <div class="captcha-box">
                <span id="captcha_display" class="captcha-text">448Y</span>
                <button type="button" class="refresh-btn" onclick="generarCaptcha()">&#x21bb;</button>
            </div>
            <input type="text" id="captcha_input" placeholder="ESCRIBE EL CÓDIGO" autocomplete="off">
        </div>

        <button type="button" class="btn-ingresar" onclick="verificarAcceso()">INGRESAR A GALERÍA</button>

        <div class="register-link">
            ¿NO TIENES CÓDIGO? <a href="#">REGÍSTRATE AQUÍ</a>
        </div>
    </div>

    <script>
        const API_URL = "https://marisal.onrender.com";
        let codigoCaptchaActual = "448Y";

        function iniciarCarga() {
            let width = 0;
            const bar = document.getElementById("progress-bar");
            const text = document.getElementById("progress-text");
            const loader = document.getElementById("loader-screen");
            const card = document.getElementById("login-card");

            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    loader.style.opacity = "0";
                    setTimeout(() => {
                        loader.style.display = "none";
                        card.style.display = "block";
                    }, 500);
                } else {
                    width++;
                    bar.style.width = width + "%";
                    text.innerText = width + "%";
                }
            }, 20);
        }

        function generarCaptcha() {
            const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let result = "";
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            codigoCaptchaActual = result;
            document.getElementById("captcha_display").innerText = codigoCaptchaActual;
        }

        document.getElementById("codigo_cli").addEventListener("input", function(e) {
            this.value = this.value.toUpperCase();
        });

        async function verificarAcceso() {
            const codigoCli = document.getElementById("codigo_cli").value.trim();
            const captchaInput = document.getElementById("captcha_input").value.trim().toUpperCase();

            if (!codigoCli) {
                alert("Por favor ingrese su código de cliente.");
                return;
            }

            if (captchaInput !== codigoCaptchaActual) {
                alert("El código captcha es incorrecto.");
                generarCaptcha();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/verificar_cliente/${codigoCli}`);
                const data = await response.json();

                if (response.ok) {
                    window.location.href = "galeria.html";
                } else {
                    alert(data.detail || "El código de cliente no existe en el sistema.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error al conectar con el servidor.");
            }
        }

        window.onload = function() {
            iniciarCarga();
            generarCaptcha();
        };
    </script>
</body>
</html>
