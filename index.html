<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - ACCESO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-image: url('nube.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-container {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 400px;
        }

        .card-container.active {
            display: block;
        }

        .card-container h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #1a1a1a;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333333;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            background: rgba(245, 247, 250, 0.9);
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            font-size: 14px;
            color: #000;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            background: #ffffff;
            border-color: #ff69b4;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.25);
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        #captcha-display {
            flex: 1;
            background: linear-gradient(135deg, #eef2f7, #d4dce6);
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 4px;
            color: #ff1493;
            border-radius: 10px;
            border: 1px dashed #b0c4de;
            user-select: none;
        }

        .btn-refresh {
            background: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        button.action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff69b4, #00bfff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
            transition: all 0.3s ease;
        }

        button.action-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.4);
        }

        .switch-link {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        .switch-link a {
            color: #00bfff;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        #mensaje-login, #mensaje-registro {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- VISTA 1: INGRESO CON CÓDIGO Y CAPTCHA -->
    <div id="view-login" class="card-container active">
        <h2>ACCESO CLIENTES</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="input-codigo">TU CÓDIGO DE CLIENTE:</label>
                <input type="text" id="input-codigo" required placeholder="EJ. RP73">
            </div>
            <div class="form-group">
                <label>VERIFICACIÓN CAPTCHA:</label>
                <div class="captcha-box">
                    <div id="captcha-display">ABCD</div>
                    <button type="button" class="btn-refresh" onclick="generarCaptcha()">↻</button>
                </div>
                <input type="text" id="input-captcha" required placeholder="ESCRIBE EL CÓDIGO">
            </div>
            <button type="submit" class="action-btn">INGRESAR A GALERÍA</button>
        </form>
        <div class="switch-link">
            ¿NO TIENES CÓDIGO? <a onclick="cambiarVista('registro')">REGÍSTRATE AQUÍ</a>
        </div>
        <div id="mensaje-login"></div>
    </div>

    <!-- VISTA 2: REGISTRO DE CLIENTE NUEVO -->
    <div id="view-registro" class="card-container">
        <h2>REGISTRO DE CLIENTE</h2>
        <form id="cliente-form">
            <div class="form-group">
                <label for="nombre_cli">NOMBRE Y APELLIDO:</label>
                <input type="text" id="nombre_cli" required placeholder="EJ. JUAN PEREZ">
            </div>
            <div class="form-group">
                <label for="num_cel_cli">NÚMERO DE CELULAR:</label>
                <input type="text" id="num_cel_cli" required placeholder="EJ. 71234567" maxlength="10">
            </div>
            <div class="form-group">
                <label for="codigo_cli">TÚ CÓDIGO ES:</label>
                <input type="text" id="codigo_cli" readonly style="background-color: #eef2f7; font-weight: bold; color: #ff1493; font-size: 20px;">
            </div>
            <button type="submit" class="action-btn">REGISTRAR CLIENTE</button>
        </form>
        <div class="switch-link">
            ¿YA TIENES CÓDIGO? <a onclick="cambiarVista('login')">INICIA SESIÓN</a>
        </div>
        <div id="mensaje-registro"></div>
    </div>

    <script>
        let codigoCaptchaActual = "";

        function cambiarVista(vista) {
            document.getElementById('mensaje-login').innerText = "";
            document.getElementById('mensaje-registro').innerText = "";
            if (vista === 'login') {
                document.getElementById('view-registro').classList.remove('active');
                document.getElementById('view-login').classList.add('active');
                generarCaptcha();
            } else {
                document.getElementById('view-login').classList.remove('active');
                document.getElementById('view-registro').classList.add('active');
            }
        }

        function generarCaptcha() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let captcha = "";
            for (let i = 0; i < 4; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            codigoCaptchaActual = captcha;
            document.getElementById("captcha-display").innerText = captcha;
        }

        // Generar captcha al cargar la página
        generarCaptcha();

        // Lógica de Login verificando en la BD y Captcha
        document.getElementById("login-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const codigoIngresado = document.getElementById("input-codigo").value.trim().toUpperCase();
            const captchaIngresado = document.getElementById("input-captcha").value.trim().toUpperCase();
            const mensajeDiv = document.getElementById("mensaje-login");

            if (captchaIngresado !== codigoCaptchaActual) {
                mensajeDiv.style.color = "#b22222";
                mensajeDiv.innerText = "ERROR: CAPTCHA INCORRECTO";
                generarCaptcha();
                document.getElementById("input-captcha").value = "";
                return;
            }

            mensajeDiv.style.color = "#333333";
            mensajeDiv.innerText = "VERIFICANDO CÓDIGO...";

            try {
                const response = await fetch(`https://marisal.onrender.com/api/verificar_cliente/${codigoIngresado}`);
                const resultado = await response.json();

                if (response.ok) {
                    localStorage.setItem("codigo_cli", codigoIngresado);
                    mensajeDiv.style.color = "#008000";
                    mensajeDiv.innerText = "¡ACCESO EXITOSO!";
                    setTimeout(() => {
                        window.location.href = "galeria.html";
                    }, 800);
                } else {
                    mensajeDiv.style.color = "#b22222";
                    mensajeDiv.innerText = "ERROR: " + (resultado.detail || "CÓDIGO NO EXISTENTE");
                    generarCaptcha();
                }
            } catch (error) {
                mensajeDiv.style.color = "#b22222";
                mensajeDiv.innerText = "ERROR DE CONEXIÓN CON LA API.";
            }
        });

        // Lógica de autogeneración de código en Registro
        const nombreInput = document.getElementById("nombre_cli");
        const celularInput = document.getElementById("num_cel_cli");
        const codigoInput = document.getElementById("codigo_cli");

        function generarCodigoRegistro() {
            const nombre = nombreInput.value.trim();
            const celular = celularInput.value.trim();

            if (nombre && celular.length >= 2) {
                const palabras = nombre.split(" ");
                let iniciales = "";
                palabras.forEach(p => {
                    if (p.length > 0) iniciales += p[0].toUpperCase();
                });
                const ultimosDigitos = celular.slice(-2);
                codigoInput.value = (iniciales + ultimosDigitos).toUpperCase();
            } else {
                codigoInput.value = "";
            }
        }

        nombreInput.addEventListener("input", generarCodigoRegistro);
        celularInput.addEventListener("input", generarCodigoRegistro);

        // Envío de Registro a FastAPI
        document.getElementById("cliente-form").addEventListener("submit", async function(e) {
            e.preventDefault();

            const data = {
                codigo_cli: codigoInput.value,
                nombre_cli: nombreInput.value.trim(),
                num_cel_cli: celularInput.value.trim()
            };

            const mensajeDiv = document.getElementById("mensaje-registro");
            mensajeDiv.style.color = "#333333";
            mensajeDiv.innerText = "REGISTRANDO...";

            try {
                const response = await fetch("https://marisal.onrender.com/api/registrar_cliente", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const resultado = await response.json();

                if (response.ok) {
                    localStorage.setItem("codigo_cli", codigoInput.value);
                    mensajeDiv.style.color = "#008000";
                    mensajeDiv.innerText = "¡CLIENTE REGISTRADO CON ÉXITO!";
                    setTimeout(() => {
                        window.location.href = "galeria.html";
                    }, 1000);
                } else {
                    mensajeDiv.style.color = "#b22222";
                    mensajeDiv.innerText = "ERROR: " + (resultado.detail || "NO SE PUDO REGISTRAR");
                }
            } catch (error) {
                mensajeDiv.style.color = "#b22222";
                mensajeDiv.innerText = "ERROR DE CONEXIÓN CON LA API.";
            }
        });
    </script>
</body>
</html>
