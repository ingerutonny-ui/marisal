<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - ACCESO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-image: url('nube.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: -5px;
        }

        .logo-container img {
            width: 200px;
            height: auto;
        }

        /* Barra de progreso de 0 a 100% en 3 segundos */
        .progress-container {
            width: 100%;
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #ff69b4, #00bfff);
            border-radius: 10px;
            transition: width 3s linear;
        }

        h2 {
            text-align: center;
            color: #1a1a1a;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 0px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 11px 15px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }

        #codigo_cli {
            text-transform: uppercase;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #eef2f3;
            padding: 8px 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        #captcha-text {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ff1493;
            user-select: none;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #555;
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ff69b4, #00bfff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.4);
        }

        .register-link {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: -2px;
        }

        .register-link a {
            color: #ff1493;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo de Marisal -->
        <div class="logo-container">
            <img src="marisal--2026.png" alt="LOGO MARISAL">
        </div>

        <!-- Barra de Progreso (0 a 100% en 3 segundos) -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <h2>ACCESO CLIENTES</h2>

        <div class="input-group">
            <label for="codigo_cli">TU CÓDIGO DE CLIENTE:</label>
            <input type="text" id="codigo_cli" placeholder="EJ: RP73" autocomplete="off">
        </div>

        <div class="input-group">
            <label>VERIFICACIÓN CAPTCHA:</label>
            <div class="captcha-box">
                <span id="captcha-text"></span>
                <button type="button" class="refresh-btn" onclick="generarCaptcha()">🔄</button>
            </div>
            <input type="text" id="captcha-input" placeholder="INGRESA EL CAPTCHA" autocomplete="off">
        </div>

        <button type="button" class="submit-btn" onclick="verificarAcceso()">INGRESAR A GALERÍA</button>

        <div class="register-link">
            ¿NO TIENES CÓDIGO? <a href="registro.html">REGÍSTRATE AQUÍ</a>
        </div>
    </div>

    <script>
        let codigoCaptchaActual = "";

        // Iniciar animación de la barra de progreso de 0 a 100% en exactamente 3 segundos
        window.addEventListener("DOMContentLoaded", () => {
            const bar = document.getElementById("progressBar");
            setTimeout(() => {
                bar.style.width = "100%";
            }, 100);
        });

        document.getElementById("codigo_cli").addEventListener("input", function (e) {
            this.value = this.value.toUpperCase();
        });

        function generarCaptcha() {
            const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let captcha = "";
            for (let i = 0; i < 4; i++) {
                captcha += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            codigoCaptchaActual = captcha;
            document.getElementById("captcha-text").innerText = captcha;
        }

        async function verificarAcceso() {
            const codigoInput = document.getElementById("codigo_cli").value.trim();
            const captchaInput = document.getElementById("captcha-input").value.trim().toUpperCase();

            if (!codigoInput) {
                alert("Por favor, ingresa tu código de cliente.");
                return;
            }

            if (captchaInput !== codigoCaptchaActual) {
                alert("El código captcha ingresado es incorrecto.");
                generarCaptcha();
                document.getElementById("captcha-input").value = "";
                return;
            }

            try {
                const response = await fetch(`https://marisal.onrender.com/api/verificar_cliente/${codigoInput}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "El código de cliente no existe en el sistema.");
                }

                const data = await response.json();

                localStorage.setItem("codigo_cliente", data.codigo);
                localStorage.setItem("nombre_cliente", data.nombre);

                window.location.href = "galeria.html";

            } catch (error) {
                alert(error.message);
                generarCaptcha();
                document.getElementById("captcha-input").value = "";
            }
        }

        window.onload = generarCaptcha;
    </script>
</body>
</html>
