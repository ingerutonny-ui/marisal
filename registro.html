<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARISAL - REGISTRO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
        }

        body {
            background-image: url('nube.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: -5px;
        }

        .logo-container img {
            width: 180px;
            height: auto;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: -2px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 11px;
            font-weight: bold;
            color: #cbd5e1;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
        }

        #nombre_cliente, #celular_cliente {
            text-transform: uppercase;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff69b4, #00bfff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.4);
        }

        .back-link {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: -2px;
        }

        .back-link a {
            color: #ff69b4;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="marisal--2026.png" alt="LOGO MARISAL">
        </div>

        <h2>REGISTRO DE CLIENTE</h2>

        <div class="input-group">
            <label for="nombre_cliente">NOMBRE COMPLETO:</label>
            <input type="text" id="nombre_cliente" placeholder="EJ: JUAN PÉREZ" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="celular_cliente">CELULAR:</label>
            <input type="text" id="celular_cliente" placeholder="EJ: 70000000" autocomplete="off">
        </div>

        <button type="button" class="submit-btn" onclick="registrarCliente()">REGISTRARSE</button>

        <div class="back-link">
            ¿YA TIENES CÓDIGO? <a href="index.html">INICIA SESIÓN AQUÍ</a>
        </div>
    </div>

    <script>
        document.getElementById("nombre_cliente").addEventListener("input", function (e) {
            this.value = this.value.toUpperCase();
        });
        document.getElementById("celular_cliente").addEventListener("input", function (e) {
            this.value = this.value.toUpperCase();
        });

        async function registrarCliente() {
            const nombre = document.getElementById("nombre_cliente").value.trim();
            const celular = document.getElementById("celular_cliente").value.trim();

            if (!nombre || !celular) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            try {
                const response = await fetch("https://marisal.onrender.com/api/registrar_cliente", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        celular: celular
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "No se pudo completar el registro.");
                }

                const data = await response.json();

                alert(`¡REGISTRO EXITOSO! TU CÓDIGO ASIGNADO ES: ${data.codigo}`);
                window.location.href = "index.html";

            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
</html>
